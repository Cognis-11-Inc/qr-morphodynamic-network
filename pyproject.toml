[project]
name = "qr-morphodynamic-analysis"
version = "0.1.0"
description = "Analysis tools for QR Morphodynamic Network experiments"
requires-python = ">=3.12"

[project.urls]
Repository = "https://github.com/Cognis-11-Inc/qr-morphodynamic-network"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
